services:
  dnslookup:
    build: .
    ports:
      - "${PORT:-3000}:3000"
      # For the built-in ACME client, also publish ports 80/443 using
      # compose.acme.yaml (HTTP-01 validation and the HTTPS listener).
    environment:
      PORT: 3000
      HTTPS_PORT: 8443
      DOH_ENDPOINT: "${DOH_ENDPOINT:-https://cloudflare-dns.com/dns-query}"
      DATA_DIR: /data
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    volumes:
      - app_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    init: true

volumes:
  app_data:
