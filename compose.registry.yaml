# Deploys the prebuilt image from GitHub Container Registry (no build, no clone needed).
# Use: docker compose -f compose.registry.yaml up -d
# Pin a release with: BNGLOOKUP_TAG=2.4.0 docker compose -f compose.registry.yaml up -d
# For the ACME client also publish 80/443: add -f compose.acme.yaml
services:
  dnslookup:
    image: ghcr.io/banaanga/bnglookup:${BNGLOOKUP_TAG:-latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      HTTPS_PORT: 8443
      DOH_ENDPOINT: "${DOH_ENDPOINT:-https://cloudflare-dns.com/dns-query}"
      DATA_DIR: /data
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      BLOCKLIST_RESOLVER: "${BLOCKLIST_RESOLVER:-}"
      WHOIS_SERVERS: "${WHOIS_SERVERS:-}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      UPDATE_CHECK: "${UPDATE_CHECK:-true}"
      SMTP_TEST_HELO: "${SMTP_TEST_HELO:-}"
      URLHAUS_AUTH_KEY: "${URLHAUS_AUTH_KEY:-}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      GOOGLE_SAFE_BROWSING_KEY: "${GOOGLE_SAFE_BROWSING_KEY:-}"
      SCREENSHOTS: "${SCREENSHOTS:-true}"
      SCREENSHOT_JAVASCRIPT: "${SCREENSHOT_JAVASCRIPT:-false}"
    volumes:
      - app_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # 1 GB leaves room for the headless browser used by website previews.
    mem_limit: 1g
    init: true

volumes:
  app_data:
