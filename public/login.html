<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101810">
    <title>Log in · BNGlookup</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script src="/branding.js" defer></script>
    <script src="/account.js" defer></script>
  </head>
  <body>
    <main class="page account-page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Home">
          <img class="brand-logo" src="/brand-logo.svg" alt="" width="40" height="40">
          <span class="brand-name">DNSLookup</span>
        </a>
      </header>
      <section class="account-card">
        <p class="eyebrow">ACCOUNT</p>
        <h1>Log in</h1>
        <p class="account-description">Sign in to use features that require an account.</p>
        <form id="login-form" class="account-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
          <p class="error-message" id="auth-error" role="alert" hidden></p>
          <button class="submit-button" type="submit"><span>Log in</span><span aria-hidden="true">→</span></button>
        </form>
      </section>
    </main>
  </body>
</html>
