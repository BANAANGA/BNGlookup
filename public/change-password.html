<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101810">
    <title>Change password · BNGlookup</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script src="/branding.js" defer></script>
    <script src="/account.js" defer></script>
  </head>
  <body>
    <main class="page account-page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Home">
          <img class="brand-logo" src="/brand-logo.svg" alt="" width="40" height="40">
          <span class="brand-name">DNSLookup</span>
        </a>
      </header>
      <section class="account-card">
        <p class="eyebrow">ACCOUNT</p>
        <h1>Change your password</h1>
        <p class="account-description">Your account requires a new password before you can continue. Use at least 12 characters.</p>
        <form id="change-form" class="account-form">
          <label for="currentPassword">Current password</label>
          <input id="currentPassword" name="currentPassword" type="password" maxlength="128" autocomplete="current-password" required>
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
          <p class="error-message" id="auth-error" role="alert" hidden></p>
          <button class="submit-button" type="submit"><span>Change password</span><span aria-hidden="true">→</span></button>
        </form>
      </section>
    </main>
  </body>
</html>
