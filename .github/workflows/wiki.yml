name: Publish wiki

# Copies docs/ into the repository's GitHub wiki whenever the docs on main change.
# The wiki must be enabled and have at least one page (create any page once in the
# Wiki tab) before the first run, because GitHub only creates the wiki repository then.
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/build-wiki.js", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki repository does not exist yet. Enable the wiki in Settings, create any first page in the Wiki tab, then run this workflow again."
            exit 1
          fi

      - name: Build the pages
        run: node scripts/build-wiki.js wiki "$GITHUB_REPOSITORY"

      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Update the wiki from docs/ at ${GITHUB_SHA::7}"
          git push
